<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Aeroflot ОТО | Экран инженера</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=mobile2" />
</head>
<body class="worker-page">
  <main class="worker-shell">
    <header class="worker-header">
      <div>
        <p class="eyebrow">АЭРОФЛОТ / ОТО</p>
        <h1>Инженер</h1>
      </div>

      <div class="worker-account" aria-label="Аккаунт сотрудника">
        <div class="account-avatar" id="account-avatar">--</div>
        <div class="account-copy">
          <p class="section-label">Учетная запись</p>
          <div id="account-name" class="account-name">—</div>
          <div id="account-role" class="account-role">—</div>
        </div>
        <button id="logout-button" type="button" class="role-link">Выйти</button>
        <div id="worker-status" class="worker-status">Свободен</div>
      </div>

    </header>

    <section class="worker-map-card">
      <div class="section-heading">
        <p class="section-label">Маршрут на перроне</p>
        <span id="self-position" class="task-state">ВЫ: НЕТ ТОЧКИ</span>
        <span id="map-distance" class="task-state">НЕТ МАРШРУТА</span>
      </div>
      <div id="worker-map"></div>
    </section>

    <section class="worker-grid">
      <article class="worker-profile">
        <p class="section-label">Профиль</p>
        <div id="worker-skill" class="worker-skill"></div>
      </article>

      <article class="assignment-card" id="assignment-card">
        <div class="section-heading">
          <p class="section-label">Текущее назначение</p>
          <span id="task-state" class="task-state">ОЖИДАНИЕ</span>
        </div>
        <div id="task-content" class="task-content">Новых заявок нет.</div>
      </article>
    </section>

    <section class="notice-card">
      <div id="worker-notice">Ожидание назначения от диспетчера. Нажатие на карту отправляет вашу позицию.</div>
    </section>
  </main>

  <div class="worker-dock" id="worker-dock">
    <button id="complete-task" type="button" hidden>Завершить задачу</button>
    <button id="aog-task" type="button" hidden>Поставить AOG</button>
  </div>

  <div id="worker-toast" class="worker-toast" role="status" aria-live="polite" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="auth.js"></script>
  <script src="walk.js"></script>
  <script src="worker.js"></script>
</body>
</html>
