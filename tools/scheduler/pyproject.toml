[project]
name = "scheduler"
version = "0.1.0"
description = "Simple scheduler written in python for database time purposes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
scheduler = "scheduler:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
