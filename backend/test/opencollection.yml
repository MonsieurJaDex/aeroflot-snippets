opencollection: 1.0.0

info:
  name: Aeroflot API
  type: http

docs:
  content: |-
    Прогон коллекции сверху вниз проходит полный цикл смены на текущем API.
    {{HOST}} уже включает /api. Окружение local задаёт http://127.0.0.1:3001/api.

    Основная заявка: регистрация, вход, карта, прилёт борта, позиция инженера
    и подъёмника, замечание, очередь, назначение, приём, инструмент, маршрут,
    AOG, MEL и завершение.

    Затем три отдельные заявки на том же борту: отклонение, ожидание запчасти
    и переназначение второму инженеру. После них борт вылетает, журнал
    выгружается и приходит точка трека.
    Каждый прогон регистрирует новых пользователей и новый борт.

bundled: false
