info:
  name: setActiveMap
  type: http
  seq: 11

http:
  method: PUT
  url: "{{HOST}}/maps/active"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": "{{map_id}}"
      }
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

docs:
  content: |-
    Оставляет текущую карту активной. Идентификатор берётся из listMaps.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
