info:
  name: updateTransportPosition
  type: http
  seq: 16

http:
  method: POST
  url: "{{HOST}}/geo/updateTransportPosition"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": "{{transport_id}}",
        "vehicle_type": "MaintenanceLift",
        "new_point": [8, 6]
      }
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

docs:
  content: |-
    Подъёмник для aviation_technician. Диспетчер создаёт машину этой ручкой.

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("transport_id")) {
          bru.setVar("transport_id", bru.interpolate("{{$guid}}"));
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
