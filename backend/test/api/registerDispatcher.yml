info:
  name: registerDispatcher
  type: http
  seq: 1

http:
  method: POST
  url: "{{HOST}}/auth/register"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "dispatcher-{{run_id}}@aeroflot.example",
        "name": "Shift Lead",
        "password": "password",
        "user_role": "Dispatcher"
      }

docs:
  content: |-
    Первый запрос прогона. Создаёт диспетчера и сохраняет dispatcher_token.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.access_token
      operator: isString
  scripts:
    - type: before-request
      code: |-
        bru.setVar("run_id", Date.now().toString());
    - type: after-response
      code: |-
        bru.setVar("dispatcher_token", res.body.access_token);
        bru.setVar("dispatcher_refresh", res.body.refresh_token);
        bru.setVar("dispatcher_id", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
