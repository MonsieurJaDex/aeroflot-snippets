info:
  name: simulationStatus
  type: http
  seq: 61

http:
  method: GET
  url: "{{HOST}}/geo/simulationStatus?obj=AT-0001"
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.active
      operator: eq
      value: "true"
    - expression: res.body.x
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
