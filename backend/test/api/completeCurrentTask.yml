info:
  name: completeCurrentTask
  type: http
  seq: 35

http:
  method: POST
  url: "{{HOST}}/tasks/current/complete"
  auth:
    type: bearer
    token: "{{engineer_token}}"

docs:
  content: |-
    in_progress → done

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
