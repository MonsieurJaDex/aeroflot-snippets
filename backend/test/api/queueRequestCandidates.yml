info:
  name: queueRequestCandidates
  type: http
  seq: 60

http:
  method: POST
  url: "{{HOST}}/requests/{{candidates_id}}/queue"
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

docs:
  content: |-
    Заявка уходит в пул: `crew_remark` → `unassigned`. Только из этого статуса
    работают `/api/assign` и `/api/assign/candidates`.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: "unassigned"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
