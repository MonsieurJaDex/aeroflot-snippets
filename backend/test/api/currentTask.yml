info:
  name: currentTask
  type: http
  seq: 27

http:
  method: GET
  url: "{{HOST}}/tasks/current"
  auth:
    type: bearer
    token: "{{engineer_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
