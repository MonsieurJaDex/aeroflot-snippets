info:
  name: getRoute
  type: http
  seq: 13

http:
  method: POST
  url: "{{HOST}}/getRoute"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "start_point": [6, 6],
        "end_point": [10, 10]
      }
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
