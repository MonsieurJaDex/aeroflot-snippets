info:
  name: listMaps
  type: http
  seq: 9

http:
  method: GET
  url: "{{HOST}}/maps"
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: after-response
      code: |-
        bru.setVar("map_id", res.body.active_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
