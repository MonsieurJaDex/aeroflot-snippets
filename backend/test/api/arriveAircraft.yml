info:
  name: arriveAircraft
  type: http
  seq: 14

http:
  method: POST
  url: "{{HOST}}/aircraft/arrive"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "point": [10, 10]
      }
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

docs:
  content: |-
    Сервер выдаёт новый UUID борта. Клетка `[10, 10]` при этом должна быть свободна:
    на занятой ручка отвечает 409 `CELL_IS_BUSY`, поэтому повторный прогон коллекции
    на той же базе упадёт, пока борт с прошлого прогона не улетит (`departAircraft`,
    seq 52). Чистая база — ожидаемое предусловие прогона.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.aircraft_id
      operator: isString
  scripts:
    - type: after-response
      code: |-
        bru.setVar("aircraft_id", res.body.aircraft_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
