info:
  name: currentTaskAog
  type: http
  seq: 32

http:
  method: PUT
  url: "{{HOST}}/tasks/current/aog"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "aog": true
      }
  auth:
    type: bearer
    token: "{{engineer_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
