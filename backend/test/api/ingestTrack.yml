info:
  name: ingestTrack
  type: http
  seq: 54

http:
  method: POST
  url: "{{HOST}}/v1/track"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "obj": "{{engineer_id}}",
        "lat": 55.8312,
        "lon": 37.6361,
        "t": "2026-11-23T12:00:00.000Z",
        "acc": 5,
        "spd": 1.2
      }

docs:
  content: |-
    Без авторизации. obj — UUID инженера, тогда точка привязывается к нему.

runtime:
  scripts:
    - type: tests
      code: |-
        test("track point is accepted", function () {
          expect(res.status).to.equal(200);
          expect(res.body.accepted).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
