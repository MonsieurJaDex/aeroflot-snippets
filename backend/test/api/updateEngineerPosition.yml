info:
  name: updateEngineerPosition
  type: http
  seq: 15

http:
  method: POST
  url: "{{HOST}}/geo/updateEngineerPosition"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": "{{engineer_id}}",
        "batch": [
          [[6, 6], 1795000000],
          [[6, 7], 1795000005]
        ]
      }
  auth:
    type: bearer
    token: "{{engineer_token}}"

docs:
  content: |-
    Ближняя позиция к стоянке [10, 10]. Пишет только инженер.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
