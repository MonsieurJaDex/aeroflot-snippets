info:
  name: trainClassifier
  type: http
  seq: 22

http:
  method: POST
  url: "{{HOST}}/classify/train"
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
