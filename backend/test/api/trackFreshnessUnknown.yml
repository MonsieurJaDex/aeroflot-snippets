info:
  name: trackFreshnessUnknown
  type: http
  seq: 67

http:
  method: GET
  url: "{{HOST}}/geo/trackFreshness?obj=never-tracked-{{run_id}}"
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

docs:
  content: |-
    Объект, которого трекер не присылал: ключа нет, поэтому `fresh = false`,
    `expires_in_secs = 0`. Это не ошибка — спрашивать про неизвестный объект можно.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: tests
      code: |-
        test("an untracked object is not fresh and does not fail", function () {
          expect(res.body.fresh).to.equal(false);
          expect(res.body.expires_in_secs).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
