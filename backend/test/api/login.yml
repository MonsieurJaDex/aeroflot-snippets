info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{HOST}}/auth/login"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "engineer@aeroflot.example",
        "password": "password"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
