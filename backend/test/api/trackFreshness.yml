info:
  name: trackFreshness
  type: http
  seq: 66

http:
  method: GET
  url: "{{HOST}}/geo/trackFreshness?obj={{engineer_id}}"
  auth:
    type: bearer
    token: "{{dispatcher_token}}"

docs:
  content: |-
    Свежесть координаты объекта. Жизнь ключа трека и есть ответ: он существует,
    только пока последняя точка моложе `stale_after_secs`. После `ingestTrack`
    (seq 54) `fresh = true` и `expires_in_secs > 0`; для объекта, который никогда
    не приходил, — `fresh = false` и `0`. Пустой `obj` → 400.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.obj
      operator: eq
      value: "{{engineer_id}}"

  scripts:
    - type: tests
      code: |-
        test("reports a live coordinate as fresh", function () {
          expect(res.body).to.have.property("fresh");
          expect(res.body).to.have.property("expires_in_secs");
          // ingestTrack (seq 54) has just written a point for this engineer.
          expect(res.body.fresh).to.equal(true);
          expect(res.body.expires_in_secs).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
