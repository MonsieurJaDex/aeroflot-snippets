info:
  name: updateAccess
  type: http
  seq: 6

http:
  method: POST
  url: "{{HOST}}/auth/update_access"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{dispatcher_refresh}}"
      }

docs:
  content: |-
    Старый refresh после этого запроса больше не действует.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.access_token
      operator: isString
  scripts:
    - type: after-response
      code: |-
        bru.setVar("dispatcher_token", res.body.access_token);
        bru.setVar("dispatcher_refresh", res.body.refresh_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
